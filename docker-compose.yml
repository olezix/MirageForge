version: '3.8'

services:
  mirageforge:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - DATABASE_URL=sqlite:///./data/mirageforge.db
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Run demo
  demo:
    build: .
    command: python -m mirageforge.cli demo --out artifacts/demo --seed 42
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    profiles:
      - demo
