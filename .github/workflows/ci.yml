name: CI

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Type check with mypy
      run: |
        mypy src/mirageforge
      continue-on-error: true

    - name: Run tests
      run: |
        pytest -v --cov=mirageforge --cov-report=xml tests/

    - name: Run demo smoke test
      run: |
        python -m mirageforge.cli init-db
        python -m mirageforge.cli demo --out artifacts/demo-smoke --seed 999 --rounds 1 --candidates 20 --top 4

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t mirageforge:test .

    - name: Test Docker image
      run: |
        docker run -d --name mirageforge-test -p 8000:8000 mirageforge:test
        sleep 10
        curl -f http://localhost:8000/healthz || exit 1
        docker stop mirageforge-test
